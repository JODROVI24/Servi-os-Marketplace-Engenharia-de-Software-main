name: Improvement Gate - PertoJá Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run root test suite
        run: python -m unittest discover -s tests -v

      - name: Vercel serverless entrypoint
        run: |
          python -c "import api.index; print('✅ Vercel entrypoint importável')"

      - name: Quality gate summary
        run: |
          python -c "import database; print('✅ database module importável; engine:', database.get_active_engine())"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Sanity: arquivos estáticos existentes"
        run: |
          for f in public/index.html public/script.js public/style.css public/portal-cliente.html public/portal-prestador.html public/pedido.html; do
            test -f "$f" || { echo "FALTANDO: $f"; exit 1; }
          done
          echo "✅ Frontend presentes"

      - name: "Semântica: closing tags principais"
        run: |
          test -f public/robots.txt
          test -f public/sitemap.xml
          echo "✅ Arquivos estáticos básicos OK"
