name: CI Pipeline - PertoJá Marketplace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite
        env:
          TESTING: 'True'
          SECRET_KEY: 'ci-pipeline-test-key'
        run: |
          cd Servi-os-Marketplace-Engenharia-de-Software-main/site_marketplace
          python -m unittest test_app.py -v

      - name: Validate Serverless Entrypoint (Vercel Simulation)
        env:
          VERCEL: '1'
        run: |
          python -c "import api.index; print('✅ Vercel serverless entrypoint validado!')"
