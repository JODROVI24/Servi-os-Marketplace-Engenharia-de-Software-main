name: Improvement Gate - PertoJá Marketplace

on:
  push:
    branches: [main, melhorias]
  pull_request:
    branches: [main, melhorias]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run root test suite (unittest)
        run: python -m unittest discover -s tests -v

      - name: Run pytest with coverage (>= 80%)
        run: pytest --cov --cov-fail-under=80

      - name: Vercel serverless entrypoint
        run: |
          python -c "import api.index; print('✅ Vercel entrypoint importável')"

      - name: Quality gate summary
        run: |
          python -c "import database; print('✅ database module importável; engine:', database.get_active_engine())"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Run JS security and ESLint checks
        run: npm run lint:js

      - name: Run Vercel routing adversarial test
        run: npm run test:routing

      - name: "Sanity: arquivos estáticos existentes"
        run: |
          for f in public/index.html public/dist/app.css public/script.js public/auth.js public/style.css public/portal-cliente.html public/portal-prestador.html public/pedido.html public/robots.txt public/sitemap.xml; do
            test -f "$f" || { echo "FALTANDO: $f"; exit 1; }
          done
          echo "✅ Frontend e artefatos estáticos presentes"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      - name: Audit Node dependencies (npm audit)
        run: npm audit --audit-level=moderate
