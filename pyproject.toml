[project]
name = "pertoja-marketplace"
version = "2.0.0"
description = "PertoJá Marketplace – Plataforma hiperlocal de serviços profissionais"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0,<4",
    "Werkzeug>=3.0.0,<4",
    "requests>=2.31.0,<3",
    "psycopg2-binary>=2.9.9,<3",
    "openai>=1.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "python-dotenv>=1.0,<2",
    "gunicorn>=21.0,<28",
    "ruff>=0.8.0,<1",
    "pip-audit>=2.7.0,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", ".agents", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/run-improvement-loop.py",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

